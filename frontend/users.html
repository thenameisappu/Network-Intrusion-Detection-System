<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users — NIDS Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">User Management <div class="page-subtitle">Admin Panel</div></div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="openModal('create-user-modal')">+ Create User</button>
        <button class="btn btn-secondary btn-sm" onclick="loadUsers(1)">↻ Refresh</button>
      </div>
    </header>
    <div class="page-container">
      <div class="card">
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr><th>Username</th><th>Full Name</th><th>Email</th><th>Role</th><th>Status</th><th>Created</th><th>Actions</th></tr>
            </thead>
            <tbody id="users-tbody"></tbody>
          </table>
        </div>
        <div id="users-pagination"></div>
      </div>
    </div>
  </div>
</div>

<!-- Create user modal -->
<div class="modal-overlay hidden" id="create-user-modal">
  <div class="modal">
    <div class="modal-header"><h3 class="modal-title">Create New User</h3>
      <button class="modal-close" onclick="closeModal('create-user-modal')">✕</button></div>
    <div class="form-group"><label class="form-label">Username</label>
      <input class="form-input" id="new-username" placeholder="username"></div>
    <div class="form-group"><label class="form-label">Full Name</label>
      <input class="form-input" id="new-fullname" placeholder="Full Name"></div>
    <div class="form-group"><label class="form-label">Email</label>
      <input class="form-input" id="new-email" type="email" placeholder="email@example.com"></div>
    <div class="form-group"><label class="form-label">Password</label>
      <input class="form-input" id="new-password" type="password" placeholder="Password"></div>
    <div class="form-group"><label class="form-label">Role</label>
      <select class="form-select" id="new-role">
        <option value="analyst">Analyst</option>
        <option value="admin">Admin</option>
        <option value="viewer">Viewer</option>
      </select>
    </div>
    <div id="create-error" class="alert-banner error hidden"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('create-user-modal')">Cancel</button>
      <button class="btn btn-primary" id="create-user-btn" onclick="createUser()">Create</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/sidebar.js"></script>
<script>
let currentUser = null;

async function init() {
  const user = await auth.requireAuth();
  if (!user) return;
  if (!auth.isAdmin()) { window.location.href = 'dashboard.html'; return; }
  currentUser = user;
  renderSidebar();
  loadUsers(1);
}

async function loadUsers(page = 1) {
  showTableLoading('users-tbody', 7);
  const resp = await api.admin.users({ page, per_page: 20 });
  if (!resp.success) { showEmpty('users-tbody', 'Failed to load users.', 7); return; }
  const d = resp.data;
  if (!d.users.length) { showEmpty('users-tbody', 'No users found.', 7); return; }
  document.getElementById('users-tbody').innerHTML = d.users.map(u => `
    <tr>
      <td><span class="mono">${escHtml(u.username)}</span></td>
      <td>${escHtml(u.full_name || '—')}</td>
      <td>${escHtml(u.email || '—')}</td>
      <td><span class="badge ${u.role === 'admin' ? 'badge-info' : 'badge-neutral'}">${escHtml(u.role)}</span></td>
      <td><span class="badge ${u.is_active ? 'badge-success' : 'badge-critical'}">${u.is_active ? 'Active' : 'Inactive'}</span></td>
      <td class="mono" style="font-size:11px">${fmt.date(u.created_at)}</td>
      <td>
        <div style="display:flex;gap:4px">
          ${u.id !== currentUser.id ? `
            <button class="btn btn-secondary btn-sm" onclick="toggleUser('${u.id}')">${u.is_active ? 'Disable' : 'Enable'}</button>
            <button class="btn btn-danger btn-sm" onclick="deleteUser('${u.id}', '${escHtml(u.username)}')">Delete</button>
          ` : '<span class="text-muted" style="font-size:12px">(You)</span>'}
        </div>
      </td>
    </tr>
  `).join('');
  buildPagination('users-pagination', d, loadUsers);
}

async function toggleUser(id) {
  const resp = await api.admin.toggleUser(id);
  if (resp.success) { toast.success('Status updated'); loadUsers(); }
  else toast.error('Failed', resp.message);
}

async function deleteUser(id, username) {
  if (!confirm(`Delete user "${username}"? This cannot be undone.`)) return;
  const resp = await api.admin.deleteUser(id);
  if (resp.success) { toast.success('User deleted'); loadUsers(); }
  else toast.error('Failed', resp.message);
}

async function createUser() {
  const errEl = document.getElementById('create-error');
  errEl.classList.add('hidden');
  const data = {
    username: document.getElementById('new-username').value.trim(),
    full_name: document.getElementById('new-fullname').value.trim(),
    email: document.getElementById('new-email').value.trim(),
    password: document.getElementById('new-password').value,
    role: document.getElementById('new-role').value,
  };
  if (!data.username || !data.password || !data.email) {
    errEl.textContent = 'Username, email, and password are required.';
    errEl.classList.remove('hidden');
    return;
  }
  setLoading('create-user-btn', true);
  const resp = await api.auth.register(data);
  setLoading('create-user-btn', false);
  if (resp.success) {
    toast.success('User created', data.username);
    closeModal('create-user-modal');
    loadUsers();
  } else {
    errEl.textContent = resp.message || 'Failed to create user.';
    errEl.classList.remove('hidden');
  }
}

init();
</script>
</body>
</html>
